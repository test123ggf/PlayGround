lor:#9793a8;padding:8px;transition:color .2s}.icon-btn:hover{color:white}.play-btn{width:42px;height:42px;border-radius:50%;background:#f2ecff;color:#15101f;display:grid;place-items:center;box-shadow:0 0 24px #c9a9ff30;transition:transform .2s,box-shadow .2s}.play-btn:hover{transform:scale(1.06);box-shadow:0 0 34px #c9a9ff66}.play-btn svg{width:14px;height:14px}.volume{justify-self:end;display:flex;align-items:center;gap:11px;color:#8c899e}.volume svg{width:15px}.volume input{width:86px;accent-color:#c3a1ff}.time{font:9px 'DM Mono',monospace;color:#777489;margin-left:10px}.control-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.modes{display:flex;gap:6px}.mode-btn{font:9px 'DM Mono',monospace;letter-spacing:.13em;color:#89869b;background:transparent;border:1px solid transparent;padding:9px 13px;border-radius:20px;cursor:pointer;transition:.2s}.mode-btn:hover{color:#eee}.mode-btn.active{color:#e9ddff;border-color:#a988d966;background:#ad8be31b;box-shadow:inset 0 0 14px #ad8be310}.tools{display:flex;align-items:center;gap:9px}.color-set{display:flex;gap:7px;margin-right:9px}.swatch{width:13px;height:13px;border-radius:50%;border:1px solid #ffffff44;cursor:pointer;padding:0;opacity:.68}.swatch.active{outline:1px solid #fff;outline-offset:3px;opacity:1}.upload-btn,.pill{font:9px 'DM Mono',monospace;letter-spacing:.12em;border:1px solid var(--line);border-radius:20px;padding:10px 15px;color:#d4d0e1;transition:.2s}.upload-btn:hover,.pill:hover{border-color:#b99af1;color:white;background:#ffffff08}.upload-btn{display:flex;align-items:center;gap:8px}.upload-btn svg{width:13px}.pill{padding:10px 14px}.hint{position:absolute;z-index:1;bottom:23%;left:50%;transform:translateX(-50%);font:9px 'DM Mono',monospace;letter-spacing:.12em;color:#727083;white-space:nowrap}.hint b{font-weight:400;color:#b5a2dc}.file{display:none}.now-playing{color:var(--b)}.playing .cover{animation:coverPulse 2.4s ease-in-out infinite}@keyframes coverPulse{50%{box-shadow:0 0 18px #b69aff55}}.toast{position:absolute;z-index:5;top:96px;left:50%;transform:translate(-50%,-10px);padding:10px 16px;border:1px solid #ffffff20;border-radius:30px;background:#171421;color:#ddd;font:10px 'DM Mono',monospace;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.topbar{height:64px;padding:0 20px}.viewport{inset:64px 0 228px}.top-meta{font-size:8px;gap:12px}.top-meta .quality{display:none}.hero-copy{top:7%}.hero-copy p{font-size:10px}.side-note{left:15px}.scene-label{right:18px;bottom:12%;font-size:8px}.bottom{padding:0 17px 18px}.player{height:72px;grid-template-columns:minmax(0,1fr) auto;margin-bottom:12px}.track{gap:9px}.cover{width:34px;height:34px}.transport{gap:13px}.transport .skip{display:none}.volume{display:none}.time{display:none}.control-row{align-items:flex-start;flex-direction:column;gap:12px}.modes{width:100%;justify-content:space-between;gap:0}.mode-btn{padding:9px 8px;font-size:8px}.tools{width:100%;justify-content:space-between}.hint{bottom:22%;font-size:8px}.upload-btn,.pill{font-size:8px;padding:9px 12px}.brand{font-size:11px}.eyebrow{font-size:8px}}@media(max-width:370px){.mode-btn{padding:8px 5px;letter-spacing:.05em}.color-set{gap:5px;margin-right:4px}.tools{gap:5px}}

<body>
<main class="shell" id="app">
<div class="grain"></div>
<header class="topbar"><div class="brand"><span class="brand-mark"><i></i></span> NOCTURNE</div><div class="top-meta"><span><i class="live-dot"></i><span id="status">AUDIO READY</span></span><span class="quality">SPATIAL ENGINE&nbsp; / &nbsp;01</span></div></header>
<section class="viewport" aria-label="Interactive 3D music visualization"><canvas id="scene"></canvas><div class="hero-copy"><div class="eyebrow">A listening instrument</div><h1>See what you feel.</h1><p>Sound, translated into another dimension.</p></div><div class="side-note">SOUND IN MOTION&nbsp; · &nbsp;01—∞</div><div class="scene-label">VISUALIZER <span id="modeLabel">PRISM</span><br>DEPTH <span>∞</span></div><div class="hint" id="hint"><b>SPACE</b> to play&nbsp;&nbsp;·&nbsp;&nbsp; drag to orbit</div></section>
<section class="bottom"><div class="player" id="player"><div class="track"><div class="cover"></div><div style="min-width:0"><div class="track-name" id="trackName">Midnight signal</div><div class="artist" id="trackArtist">NOCTURNE STUDIO&nbsp; · &nbsp;DEMO</div></div></div><div class="transport"><button class="icon-btn skip" id="prev" aria-label="Previous track"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 3h2v10H3zm10 0v10L5.5 8z"/></svg></button><button class="play-btn" id="play" aria-label="Play"><svg id="playIcon" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5a.7.7 0 0 1 1.05-.61l8 5a.72.72 0 0 1 0 1.22l-8 5A.7.7 0 0 1 4 12.5z"/></svg></button><button class="icon-btn skip" id="next" aria-label="Next track"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11 3h2v10h-2zM3 3v10l7.5-5z"/></svg></button></div><div class="volume"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 8v4h3l4 3V5L6 8H3Z"/><path d="M13 7a4 4 0 0 1 0 6m2-8a7 7 0 0 1 0 10"/></svg><input id="volume" type="range" min="0" max="1" step=".01" value=".65" aria-label="Volume"><span class="time" id="clock">00:00</span></div></div><div class="control-row"><div class="modes" role="group" aria-label="Visualization mode"><button class="mode-btn active" data-mode="prism">PRISM</button><button class="mode-btn" data-mode="tunnel">TUNNEL</button><button class="mode-btn" data-mode="orbit">ORBIT</button><button class="mode-btn" data-mode="wave">WAVEFORM</button></div><div class="tools"><div class="color-set" aria-label="Color palette"><button class="swatch active" data-palette="violet" style="background:#c4a4ff" aria-label="Violet palette"></button><button class="swatch" data-palette="ocean" style="background:#5ce8db" aria-label="Ocean palette"></button><button class="swatch" data-palette="ember" style="background:#ff936d" aria-label="Ember palette"></button></div><label class="upload-btn" for="audioFile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 11V2m0 0L4.5 5.5M8 2l3.5 3.5M2.5 10v3.5h11V10"/></svg>LOAD AUDIO</label><input class="file" id="audioFile" type="file" accept="audio/*"><button class="pill" id="fullscreen">⛶ &nbsp;FULLSCREEN</button></div></div></section><div class="toast" id="toast"></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),app=document.getElementById('app');let w=0,h=0,dpr=1,mode='prism',playing=false,started=0,elapsed=0,phase=0,drag=null,spinX=0,spinY=0,targetX=0,targetY=0,audioCtx=null,analyser=null,source=null,gain=null,audioEl=null,objectUrl=null,synthNodes=[],synthetic=false;const bins=new Uint8Array(128),wave=new Uint8Array(128);let energy=0,beat=0,prevEnergy=0;
const palettes={violet:{a:'#c4a4ff',b:'#5ce8db',rgb:[196,164,255]},ocean:{a:'#65ebdf',b:'#77aaff',rgb:[101,235,223]},ember:{a:'#ff9b72',b:'#ffdf88',rgb:[255,155,114]}};let palette=palettes.violet;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function rgba(color,alpha){return `rgba(${color[0]},${color[1]},${color[2]},${alpha})`}function hexRgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function project(x,y,z){const c=Math.cos(spinY),s=Math.sin(spinY),cx=Math.cos(spinX),sx=Math.sin(spinX);let xx=x*c-z*s,zz=x*s+z*c,yy=y*cx-zz*sx;zz=y*sx+zz*cx;const f=Math.min(w,h)*.82,scale=f/(f+zz+5.7);return{x:w/2+xx*f*scale,y:h*.54+yy*f*scale,scale,z:zz}}
function line(a,b,color,width=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function getAudio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.82;gain=audioCtx.createGain();gain.gain.value=+document.getElementById('volume').value;analyser.connect(gain);gain.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume()}
function startSynth(){getAudio();synthetic=true;const now=audioCtx.currentTime;const master=audioCtx.createGain();master.gain.value=.0001;master.connect(analyser);master.gain.exponentialRampToValueAtTime(.12,now+1.4);synthNodes=[];[55,82.41,110,164.81,220].forEach((freq,i)=>{const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type=i===1?'triangle':'sine';osc.frequency.value=freq;osc.detune.value=(i-2)*3;g.gain.value=[.22,.12,.1,.045,.025][i];filter.type='lowpass';filter.frequency.value=620+i*150;osc.connect(filter);filter.connect(g);g.connect(master);osc.start();synthNodes.push(osc)});const lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();lfo.frequency.value=.13;lg.gain.value=220;lfo.connect(lg);lg.connect(master.gain);lfo.start();synthNodes.push(lfo);synthNodes.master=master}
function stopSynth(){if(synthNodes.master){try{synthNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);synthNodes.master.gain.setTargetAtTime(.0001,audioCtx.currentTime,.12);setTimeout(()=>synthNodes.forEach(n=>{try{n.stop()}catch(e){}}),600)}catch(e){}}synthNodes=[]}
function toggle(){if(!playing){getAudio();if(!audioEl)startSynth();else audioEl.play().catch(()=>toast('Choose an audio file to begin'));playing=true;started=performance.now();app.classList.add('playing');document.getElementById('status').textContent='LIVE AUDIO';document.getElementById('play').setAttribute('aria-label','Pause');document.getElementById('playIcon').innerHTML='<path d="M3 2.7h3.5v10.6H3zm6.5 0H13v10.6H9.5z"/>';document.getElementById('hint').innerHTML='<b>SPACE</b> to pause&nbsp;&nbsp;·&nbsp;&nbsp; drag to orbit'}else{playing=false;if(audioEl)audioEl.pause();else stopSynth();app.classList.remove('playing');document.getElementById('status').textContent='AUDIO READY';document.getElementById('play').setAttribute('aria-label','Play');document.getElementById('playIcon').innerHTML='<path d="M4 2.5a.7.7 0 0 1 1.05-.61l8 5a.72.72 0 0 1 0 1.22l-8 5A.7.7 0 0 1 4 12.5z"/>';document.getElementById('hint').innerHTML='<b>SPACE</b> to play&nbsp;&nbsp;·&nbsp;&nbsp; drag to orbit'}}
document.getElementById('play').addEventListener('click',toggle);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggle()}});document.getElementById('volume').addEventListener('input',e=>{if(gain)gain.gain.value=+e.target.value});
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
document.getElementById('audioFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);if(audioEl){audioEl.pause();audioEl.src=''}stopSynth();synthetic=false;audioEl=new Audio(objectUrl);audioEl.crossOrigin='anonymous';getAudio();source=audioCtx.createMediaElementSource(audioEl);source.connect(analyser);document.getElementById('trackName').textContent=file.name.replace(/\.[^.]+$/,'');document.getElementById('trackArtist').textContent='LOCAL FILE  ·  '+(file.type.split('/')[1]||'AUDIO').toUpperCase();audioEl.addEventListener('ended',()=>{playing=false;app.classList.remove('playing');document.getElementById('status').textContent='AUDIO READY';toggleUi(false)});if(!playing)toggle();else audioEl.play().catch(()=>{});toast('Now visualizing your track')});
function toggleUi(on){document.getElementById('play').setAttribute('aria-label',on?'Pause':'Play');document.getElementById('playIcon').innerHTML=on?'<path d="M3 2.7h3.5v10.6H3zm6.5 0H13v10.6H9.5z"/>':'<path d="M4 2.5a.7.7 0 0 1 1.05-.61l8 5a.72.72 0 0 1 0 1.22l-8 5A.7.7 0 0 1 4 12.5z"/>'}
document.querySelectorAll('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('.mode-btn.active').classList.remove('active');btn.classList.add('active');mode=btn.dataset.mode;document.getElementById('modeLabel').textContent=mode.toUpperCase()}));document.querySelectorAll('.swatch').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('.swatch.active').classList.remove('active');btn.classList.add('active');palette=palettes[btn.dataset.palette];document.documentElement.style.setProperty('--a',palette.a);document.documentElement.style.setProperty('--b',palette.b)}));
document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});document.getElementById('prev').addEventListener('click',()=>{elapsed=0;toast('Demo track · Midnight signal')});document.getElementById('next').addEventListener('click',()=>{elapsed=0;toast('You are listening to Midnight signal')});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-drag.x)*.006;targetX=Math.max(-.8,Math.min(.8,targetX+(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
function readAudio(t){if(analyser&&playing){analyser.getByteFrequencyData(bins);analyser.getByteTimeDomainData(wave);let sum=0;for(let i=0;i<bins.length;i++)sum+=bins[i];energy=sum/bins.length/255;if(energy>prevEnergy+.035)beat=Math.min(1,beat+(energy-prevEnergy)*4);prevEnergy=energy}else{for(let i=0;i<bins.length;i++){const f=i/bins.length;bins[i]=Math.max(3,Math.min(255,12+Math.sin(t*1.1-f*19)*8+Math.sin(t*.6+f*10)*5+(playing?22+32*Math.pow(Math.max(0,Math.sin(t*1.5-f*8)),9):3)))}energy=playing?.15+.08*Math.sin(t*1.3):.035;for(let i=0;i<wave.length;i++)wave[i]=128+Math.sin(t*3+i*.16)*10}beat*=.9}
function drawStars(t){for(let i=0;i<110;i++){let x=((i*197.3+Math.sin(i*12.7)*80)%w+w)%w,y=((i*83.7+Math.cos(i*6.4)*55)%h+h)%h;let tw=.18+.4*(.5+.5*Math.sin(t*.5+i));ctx.fillStyle=`rgba(210,205,255,${tw*.38})`;ctx.fillRect(x,y,1,1)}}
function drawPrism(t){const pulse=1+energy*.48+beat*.16;const core=mode==='orbit'?1.04:1;ctx.save();ctx.globalCompositeOperation='lighter';const layers=mode==='tunnel'?34:17;for(let j=layers;j>=0;j--){let z=-2.9+j*.42+((t*.62)%0.42),r=(.42+j*.052)*(mode==='tunnel'?1.42:1)*pulse;const pts=[];const sides=mode==='wave'?96:6;for(let i=0;i<sides;i++){const a=i/sides*Math.PI*2+t*(j%2?.02:-.015);let audio=bins[(i*3+j*5)%bins.length]/255;const rr=r+(audio-.3)*.10;pts.push(project(Math.cos(a)*rr,Math.sin(a)*rr,z))}ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();let alpha=(1-j/layers)*.56+.04;ctx.strokeStyle=rgba(palette.rgb,alpha*(.35+energy));ctx.lineWidth=Math.max(.45,(1-j/layers)*1.6);ctx.shadowBlur=j===0?22:7;ctx.shadowColor=palette.a;ctx.stroke();if(j%3===0){for(let i=0;i<pts.length;i+=Math.max(1,Math.floor(sides/6))) {const q=project(0,0,z);line(q,pts[i],rgba(hexRgb(palette.b),alpha*.13),.7)}}}ctx.restore();
// glowing central polyhedral core
const center=project(0,0,0),radius=Math.min(w,h)*(.085+energy*.03+beat*.025);let grad=ctx.createRadialGradient(center.x-radius*.18,center.y-radius*.25,1,center.x,center.y,radius*1.7);grad.addColorStop(0,'rgba(255,255,255,.96)');grad.addColorStop(.12,rgba(palette.rgb,.87));grad.addColorStop(.38,rgba(palette.rgb,.23));grad.addColorStop(1,rgba(palette.rgb,0));ctx.fillStyle=grad;ctx.beginPath();ctx.arc(center.x,center.y,radius*1.8,0,Math.PI*2);ctx.fill();ctx.save();ctx.globalCompositeOperation='lighter';ctx.beginPath();const corners=[];for(let i=0;i<9;i++){let a=i/9*Math.PI*2+t*.18,r=radius*(i%2?.66:1)*core*(1+bins[i*9]/255*.1);corners.push(project(Math.cos(a)*r/Math.min(w,h)*2,Math.sin(a)*r/Math.min(w,h)*2,0))}corners.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=rgba(palette.rgb,.1);ctx.strokeStyle=rgba([255,255,255],.82);ctx.lineWidth=1.1;ctx.shadowBlur=18;ctx.shadowColor=palette.a;ctx.fill();ctx.stroke();for(let i=0;i<corners.length;i++){let p=corners[i],c=project(0,0,0);line(p,c,rgba(palette.rgb,.55),.7)}ctx.restore();}
function drawOrbit(t){const center=project(0,0,0),R=Math.min(w,h)*.22;ctx.save();ctx.globalCompositeOperation='lighter';for(let ring=0;ring<4;ring++){ctx.beginPath();for(let i=0;i<=200;i++){const a=i/200*Math.PI*2;const r=R*(.58+ring*.18)+(bins[Math.floor(i/200*127)]/255)*12;const p=project(Math.cos(a+ring*.5+t*.1)*r/Math.min(w,h)*2,Math.sin(a+ring*.5+t*.1)*r/Math.min(w,h)*2,(ring-1.5)*.24);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle=rgba(palette.rgb,.25+ring*.08);ctx.lineWidth=1.2;ctx.shadowBlur=12;ctx.shadowColor=palette.a;ctx.stroke()}for(let i=0;i<8;i++){const a=t*.22+i*Math.PI/4,b=bins[i*12]/255;const p=project(Math.cos(a)*.5,Math.sin(a)*.5,Math.sin(a*2)*.24);ctx.fillStyle=palette.b;ctx.shadowBlur=10+b*20;ctx.shadowColor=palette.b;ctx.beginPath();ctx.arc(p.x,p.y,2+b*4,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawWave(t){const cx=w/2,cy=h*.54,R=Math.min(w,h)*.185;ctx.save();ctx.globalCompositeOperation='lighter';for(let layer=0;layer<5;layer++){ctx.beginPath();for(let i=0;i<=wave.length;i++){const k=i%wave.length,angle=k/wave.length*Math.PI*2;const val=analyser&&playing?(wave[k]-128)/128:Math.sin(t*3+k*.16)*.12;const rad=R*(.68+layer*.13)+val*R*(.3+energy);const p=project(Math.cos(angle)*rad/Math.min(w,h)*2,Math.sin(angle)*rad/Math.min(w,h)*2,layer*.11-0.2);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.closePath();ctx.strokeStyle=rgba(palette.rgb,.62-layer*.085);ctx.lineWidth=layer===0?1.6:1;ctx.shadowBlur=13;ctx.shadowColor=palette.a;ctx.stroke()}ctx.restore()}
function drawBars(t){if(mode==='orbit')return;const count=72,cx=w/2,cy=h*.54,R=Math.min(w,h)*.3;ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<count;i++){const a=i/count*Math.PI*2;const v=bins[Math.floor(i/count*127)]/255;const inner=R*(mode==='tunnel'?.68:.75),outer=inner+5+v*R*.32;const p1=project(Math.cos(a)*inner/Math.min(w,h)*2,Math.sin(a)*inner/Math.min(w,h)*2,.1),p2=project(Math.cos(a)*outer/Math.min(w,h)*2,Math.sin(a)*outer/Math.min(w,h)*2,.1);line(p1,p2,rgba(i%2?palette.rgb:hexRgb(palette.b),.25+v*.75),1+v*1.5)}ctx.restore()}
function frame(now){requestAnimationFrame(frame);const t=now/1000;readAudio(t);spinX+=(targetX-spinX)*.045;spinY+=(targetY-spinY)*.045;ctx.clearRect(0,0,w,h);const glow=ctx.createRadialGradient(w/2,h*.54,0,w/2,h*.54,Math.max(w,h)*.48);glow.addColorStop(0,rgba(palette.rgb,.045+energy*.1));glow.addColorStop(1,'rgba(8,8,15,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);drawStars(t);drawBars(t);if(mode==='orbit')drawOrbit(t);else if(mode==='wave')drawWave(t);else drawPrism(t);if(playing){elapsed=audioEl?audioEl.currentTime:(now-started)/1000;const m=String(Math.floor(elapsed/60)).padStart(2,'0'),s=String(Math.floor(elapsed%60)).padStart(2,'0');document.getElementById('clock').textContent=m+':'+s}}
requestAnimationFrame(frame);
